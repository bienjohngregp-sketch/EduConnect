
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EduConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 5px 25px #00000010;
        }

        .logo {
            text-align: center;
            color: #155eef;
            font-size: 28px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #172554;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #155eef;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #155eef;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104bc4;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }

        a {
            color: #155eef;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">EduConnect</div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">
        Login to your student account
    </p>

    <form id="loginForm">

        <label>Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <p id="message"></p>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register here</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

loginForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";
    message.textContent = "";

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            throw error;
        }   

        // Check account status
        const { data: profile, error: profileError } = await supabaseClient
            .from("profiles")
            .select("is_active")
            .eq("id", data.user.id)
            .single();

        if (profileError || !profile) {
            await supabaseClient.auth.signOut();
            throw new Error("Unable to verify your account. Please contact your administrator.");
        }

        // Block deactivated accounts
        if (profile.is_active === false) {
            await supabaseClient.auth.signOut();

            throw new Error(
                "Your account has been deactivated. Please contact your school administrator."
            );
        }

        message.style.color = "green";
        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";
    } catch (error) {

        message.style.color = "red";
        message.textContent = error.message;

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }

});
</script>

</body>
</html>
