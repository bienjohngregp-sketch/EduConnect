
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EduConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7f5fc, #eee8f8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(91, 53, 165, 0.12);
            animation: fadeUp 0.7s ease;
            border: 1px solid #eee8f8;
        }

        .logo {
            text-align: center;
            color: #5b35a5;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .logo span {
            color: #7952ce;
        }

        h2 {
            text-align: center;
            color: #30204f;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #827b91;
            margin-bottom: 32px;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
            color: #40345a;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ded7eb;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 15px;
            background: #fcfbfe;
            color: #30204f;
            transition: 0.25s ease;
        }

        input:focus {
            outline: none;
            border-color: #7952ce;
            box-shadow: 0 0 0 4px rgba(121, 82, 206, 0.12);
            background: #ffffff;
        }

        input::placeholder {
            color: #aaa2b8;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #5b35a5, #7952ce);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 5px 15px rgba(91, 53, 165, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(91, 53, 165, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .register-link {
            text-align: center;
            margin-top: 28px;
            color: #827b91;
            font-size: 14px;
        }

        a {
            color: #6842b5;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s ease;
        }

        a:hover {
            color: #4b288f;
            text-decoration: underline;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 24px;
                border-radius: 16px;
            }

            .logo {
                font-size: 27px;
            }

            h2 {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">Edu<span>Connect</span></div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">
        Login to your student account
    </p>

    <form id="loginForm">

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Register here</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

loginForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";
    message.textContent = "";

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            throw error;
        }

        // Check account status
        const { data: profile, error: profileError } = await supabaseClient
            .from("profiles")
            .select("is_active")
            .eq("id", data.user.id)
            .single();

        if (profileError || !profile) {
            await supabaseClient.auth.signOut();
            throw new Error("Unable to verify your account. Please contact your administrator.");
        }

        // Block deactivated accounts
        if (profile.is_active === false) {
            await supabaseClient.auth.signOut();

            throw new Error(
                "Your account has been deactivated. Please contact your school administrator."
            );
        }

        message.style.color = "#16a34a";
        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

    } catch (error) {

        message.style.color = "#dc2626";
        message.textContent = error.message;

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }

});
</script>

</body>
</html>
