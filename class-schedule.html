
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Schedule | EduConnect</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f5fc;
            color: #302b3d;
            padding: 30px;
            animation: fadeIn 0.5s ease;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .back-link,
        .back-link:visited,
        .back-link:active {
            display: inline-block;
            margin-bottom: 22px;
            color: #6842b5 !important;
            text-decoration: none !important;
            font-weight: bold;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #4c278f !important;
            transform: translateX(-4px);
        }

        .header {
            margin-bottom: 28px;
            animation: fadeUp 0.5s ease;
        }

        .header h1 {
            color: #5b35a5;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777184;
            font-size: 14px;
        }

        .schedule-card {
            background: #ffffff;
            padding: 26px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(91, 53, 165, 0.07);
            border: 1px solid #eee8f8;
            margin-bottom: 25px;
            animation: fadeUp 0.6s ease;
        }

        .schedule-card h2 {
            margin-bottom: 20px;
            color: #6842b5;
            font-size: 21px;
        }

        #schedule-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        #schedule-form label {
            display: block;
            color: #514761;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: -9px;
        }

        #schedule-form input,
        #schedule-form select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #e1d9ef;
            border-radius: 9px;
            background: #fcfbff;
            color: #302b3d;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        #schedule-form input:focus,
        #schedule-form select:focus {
            border-color: #7952ce;
            box-shadow: 0 0 0 3px rgba(121, 82, 206, 0.12);
        }

        #schedule-form button {
            grid-column: 1 / -1;
            padding: 13px;
            background: linear-gradient(135deg, #5b35a5, #7952ce);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        #schedule-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(91, 53, 165, 0.22);
        }

        #schedule-message {
            grid-column: 1 / -1;
            font-size: 14px;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .day-card {
            background: #fbfaff;
            border: 1px solid #e8e0f5;
            border-radius: 12px;
            padding: 19px;
            min-height: 110px;
            transition: 0.25s;
        }

        .day-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(91, 53, 165, 0.09);
            border-color: #cbb9eb;
        }

        .day-card h3 {
            color: #6842b5;
            margin-bottom: 12px;
            font-size: 16px;
        }

        #schedule-list {
            color: #777184;
            font-size: 14px;
        }

        #schedule-list p {
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 16px;
            }

            .header h1 {
                font-size: 25px;
            }

            .schedule-card {
                padding: 18px;
            }

            .schedule-grid {
                grid-template-columns: 1fr;
            }

            #schedule-form {
                grid-template-columns: 1fr;
            }

            #schedule-form button,
            #schedule-message {
                grid-column: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="dashboard.html" class="back-link">
            ← Back to Dashboard
        </a>

        <div class="header">
            <h1>Class Schedule</h1>
            <p>View your weekly class schedule in EduConnect.</p>
        </div>

        <!-- Add Schedule Form -->
        <div class="schedule-card" id="schedule-form-card" hidden>
            <h2>Add Class Schedule</h2>

            <form id="schedule-form">

                <label>Subject</label>
                <select id="subject_id" required>
                    <option value="">Select Subject</option>
                </select>

                <label>Teacher</label>
                <select id="teacher_id" required>
                    <option value="">Select Teacher</option>
                </select>

                <label>Section</label>
                <input
                    type="text"
                    id="section"
                    value="BSBA MM-1B"
                    required
                >

                <label>Day</label>
                <select id="day_of_week" required>
                    <option value="">Select Day</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                </select>

                <label>Start Time</label>
                <input type="time" id="start_time" required>

                <label>End Time</label>
                <input type="time" id="end_time" required>

                <label>Room</label>
                <input
                    type="text"
                    id="room"
                    placeholder="Example: Room 201"
                >

                <button type="submit">Save Schedule</button>

                <p id="schedule-message"></p>

            </form>
        </div>

        <!-- Weekly Schedule -->
        <div class="schedule-card">
            <h2>Weekly Schedule</h2>

            <div id="schedule-list">
                Loading class schedules...
            </div>
        </div>

    </div>

    <script src="js/class-schedule.js"></script>

</body>
</html>
