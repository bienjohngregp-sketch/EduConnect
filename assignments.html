
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignments | EduConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>


<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f5fc;
    color: #263445;
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

header {
    background: linear-gradient(135deg, #5b35a5, #7952ce);
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    box-shadow: 0 4px 15px rgba(91, 53, 165, 0.18);
}

header h2 {
    font-size: 23px;
    color: white;
}

header nav {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}

header a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    transition: 0.2s;
}

header a:hover {
    color: #e3d6ff;
    transform: translateY(-2px);
}

main {
    max-width: 1050px;
    margin: 35px auto;
    padding: 0 20px;
}

.page-title {
    margin-bottom: 25px;
    animation: fadeUp 0.5s ease both;
}

.page-title h1 {
    color: #6842b5;
    margin-bottom: 8px;
    font-size: 27px;
}

.page-title p {
    color: #718096;
    font-size: 14px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 25px;
    border: 1px solid #eee8f8;
    box-shadow: 0 5px 20px rgba(70, 45, 120, 0.06);
    animation: fadeUp 0.5s ease both;
}

.panel h2 {
    margin-bottom: 18px;
    color: #6842b5;
    font-size: 20px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #526078;
    margin-top: 8px;
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin: 10px 0 15px;
    border: 1px solid #dcd5e9;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
    background: white;
    transition: 0.2s;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #7952ce;
    box-shadow: 0 0 0 3px rgba(121, 82, 206, 0.12);
}

textarea {
    min-height: 110px;
    resize: vertical;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.primary {
    background: #7952ce;
    color: white;
}

.primary:hover {
    background: #613bb0;
}

.edit {
    background: #eee8f8;
    color: #6842b5;
}

.edit:hover {
    background: #e1d6f5;
}

.delete {
    background: #dc4545;
    color: white;
}

.delete:hover {
    background: #bd3030;
}

.assignment {
    background: #fff;
    border: 1px solid #eee8f8;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(70, 45, 120, 0.04);
    transition: 0.25s;
    animation: fadeUp 0.4s ease both;
}

.assignment:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 18px rgba(91, 53, 165, 0.09);
    border-color: #d8c9f2;
}

.assignment h3 {
    color: #6842b5;
    margin-bottom: 12px;
    font-size: 18px;
}

.assignment p {
    margin-bottom: 10px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    color: #526078;
    font-size: 14px;
}

.subject-label {
    color: #7952ce;
    font-weight: bold;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
    flex-wrap: wrap;
}

#message {
    margin-top: 12px;
    font-size: 14px;
}

#submission-message {
    margin-top: 12px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.hidden {
    display: none;
}

#assignmentList {
    color: #718096;
    line-height: 1.6;
}

#submission-form {
    border: 2px solid #d8c9f2;
    background: #faf8ff;
    margin-bottom: 22px;
}

#submission-form h3 {
    color: #6842b5;
}

#submission-form button {
    margin-right: 7px;
    margin-top: 8px;
}

@media (max-width: 600px) {
    header {
        padding: 18px 5%;
    }

    header nav {
        gap: 14px;
    }

    main {
        margin: 22px auto;
        padding: 0 14px;
    }

    .panel {
        padding: 19px;
    }

    .page-title h1 {
        font-size: 24px;
    }

    .assignment {
        padding: 16px;
    }

    .actions button {
        flex: 1;
    }

    #submission-form button {
        margin-right: 0;
        width: 100%;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

</head>

<body>
<header>
    <h2>EduConnect</h2>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="subjects.html">Subjects</a>
        <a href="assignments.html">Assignments</a>
        <a href="#" id="logoutButton">Logout</a>
    </nav>
</header>

<main>
    <div class="page-title">
        <h1>Assignments</h1>
        <p>Manage and view your school assignments.</p>
    </div>

    <section class="panel hidden" id="formPanel">
        <h2 id="formTitle">Create Assignment</h2>

        <form id="assignmentForm">
            <label for="subjectId">Select Subject</label>
            <select id="subjectId" required>
                <option value="">Loading subjects...</option>
            </select>

            <label for="title">Assignment Title</label>
            <input type="text" id="title" placeholder="Assignment Title" required>

            <label for="description">Description</label>
            <textarea id="description" placeholder="Assignment Description"></textarea>

            <label for="dueDate">Due Date and Time</label>
            <input type="datetime-local" id="dueDate" required>

            <button type="submit" class="primary" id="saveButton">
                Add Assignment
            </button>

            <button type="button" class="edit hidden" id="cancelButton">
                Cancel Edit
            </button>
        </form>

        <p id="message"></p>
    </section>

    <section class="panel">
        <h2 id="listTitle">Assignment List</h2>
        <div id="assignmentList">Loading assignments...</div>
    </section>
</main>

<script>
const formPanel = document.getElementById("formPanel");
const assignmentForm = document.getElementById("assignmentForm");
const assignmentList = document.getElementById("assignmentList");
const message = document.getElementById("message");
const subjectSelect = document.getElementById("subjectId");

let currentUser = null;
let currentProfile = null;
let editingId = null;

function showMessage(text, isError = false) {
    message.textContent = text;
    message.style.color = isError ? "#dc4545" : "#16834a";
}

function formatDate(date) {
    if (!date) return "No deadline";

    return new Date(date).toLocaleString("en-PH", {
        dateStyle: "medium",
        timeStyle: "short"
    });
}

async function initializePage() {
    const { data: { user }, error: authError } =
        await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("full_name, role, school_id, is_active")
            .eq("id", user.id)
            .single();

    if (profileError || !profile || !profile.school_id ||
        profile.is_active === false) {
        assignmentList.textContent =
            "Unable to load your active school profile.";
        return;
    }

    currentProfile = profile;

    if (["teacher", "admin"].includes(profile.role)) {
        formPanel.classList.remove("hidden");
        await loadSubjects();
    }

    await loadAssignments();
}

async function loadSubjects() {
    subjectSelect.innerHTML =
        '<option value="">Loading subjects...</option>';

    let query = supabaseClient
        .from("subjects")
        .select("id, subject_name, subject_code")
        .eq("school_id", currentProfile.school_id)
        .order("subject_name");

    if (currentProfile.role === "teacher") {
        query = query.eq("teacher_id", currentUser.id);
    }

    const { data, error } = await query;

    if (error) {
        subjectSelect.innerHTML =
            '<option value="">Unable to load subjects</option>';
        showMessage(error.message, true);
        return;
    }

    subjectSelect.innerHTML =
        '<option value="">Select a subject</option>';

    (data || []).forEach(subject => {
        const option = document.createElement("option");
        option.value = subject.id;
        option.textContent =
            subject.subject_name + " (" + subject.subject_code + ")";
        subjectSelect.appendChild(option);
    });

    if (!data || data.length === 0) {
        subjectSelect.innerHTML =
            '<option value="">No assigned subjects available</option>';
    }
}

async function loadAssignments() {
    assignmentList.textContent = "Loading assignments...";

    let query = supabaseClient
        .from("assignments")
        .select(`
            id,
            school_id,
            teacher_id,
            subject_id,
            title,
            description,
            due_date,
            subjects (
                subject_name,
                subject_code
            )
        `)
        .eq("school_id", currentProfile.school_id)
        .order("due_date", { ascending: true });

    if (currentProfile.role === "teacher") {
        query = query.eq("teacher_id", currentUser.id);
    }

    if (currentProfile.role === "student") {
        const { data: enrollments, error: enrollmentError } =
            await supabaseClient
                .from("subject_enrollments")
                .select("subject_id")
                .eq("student_id", currentUser.id)
                .eq("school_id", currentProfile.school_id);

        if (enrollmentError) {
            assignmentList.textContent =
                "Unable to load enrolled subjects: " +
                enrollmentError.message;
            return;
        }

        const subjectIds = (enrollments || []).map(
            item => item.subject_id
        );

        if (subjectIds.length === 0) {
            assignmentList.textContent =
                "You are not enrolled in any subjects yet.";
            return;
        }

        query = query.in("subject_id", subjectIds);
    }

    const { data, error } = await query;

    if (error) {
        assignmentList.textContent =
            "Error loading assignments: " + error.message;
        return;
    }

    assignmentList.innerHTML = "";

    if (!data || data.length === 0) {
        assignmentList.textContent =
            "No assignments available for your subjects yet.";
        return;
    }

    for (const item of data) {
        const card = document.createElement("div");
        card.className = "assignment";

        const title = document.createElement("h3");
        title.textContent = item.title;

        const subject = document.createElement("p");
        subject.className = "subject-label";
        subject.textContent = "Subject: " +
            (item.subjects?.subject_name || "Subject not available") +
            (item.subjects?.subject_code
                ? " (" + item.subjects.subject_code + ")"
                : "");

        const description = document.createElement("p");
        description.textContent =
            item.description || "No description provided.";

        const deadline = document.createElement("p");
        deadline.textContent = "Due: " + formatDate(item.due_date);

        card.append(title, subject, description, deadline);

        if (currentProfile.role === "student") {
            const submitButton = document.createElement("button");
            submitButton.textContent = "Submit Assignment";
            submitButton.className = "primary";

            submitButton.addEventListener("click", () => {
                openSubmissionForm(item);
            });

            card.appendChild(submitButton);

            const { data: existingSubmission, error: submissionError } =
                await supabaseClient
                    .from("assignment_submissions")
                    .select("id")
                    .eq("assignment_id", item.id)
                    .eq("student_id", currentUser.id)
                    .limit(1);

            if (!submissionError && existingSubmission?.length) {
                submitButton.textContent = "Already Submitted";
                submitButton.disabled = true;
            }
        }

        const canManage =
            ["teacher", "admin"].includes(currentProfile.role) &&
            (item.teacher_id === currentUser.id ||
             currentProfile.role === "admin");

        if (canManage) {
            const actions = document.createElement("div");
            actions.className = "actions";

            const editButton = document.createElement("button");
            editButton.className = "edit";
            editButton.textContent = "Edit";
            editButton.addEventListener("click", () => editAssignment(item));

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete";
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener("click", () =>
                deleteAssignment(item.id)
            );

            actions.append(editButton, deleteButton);
            card.appendChild(actions);
        }

        assignmentList.appendChild(card);
    }
}

function openSubmissionForm(assignment) {
    const existingForm = document.getElementById("submission-form");

    if (existingForm) existingForm.remove();

    const form = document.createElement("div");
    form.id = "submission-form";
    form.className = "assignment";

    const heading = document.createElement("h3");
    heading.textContent = "Submit Assignment";

    const assignmentTitle = document.createElement("p");
    assignmentTitle.textContent = assignment.title;

    const label = document.createElement("label");
    label.textContent = "Choose your file:";

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.id = "submission-file";
    fileInput.accept = ".pdf,.doc,.docx,.jpg,.jpeg,.png";

    const uploadButton = document.createElement("button");
    uploadButton.type = "button";
    uploadButton.className = "primary";
    uploadButton.textContent = "Upload and Submit";

    const cancelButton = document.createElement("button");
    cancelButton.type = "button";
    cancelButton.className = "edit";
    cancelButton.textContent = "Cancel";

    const status = document.createElement("p");
    status.id = "submission-message";

    form.append(
        heading, assignmentTitle, label,
        fileInput, uploadButton, cancelButton, status
    );

    assignmentList.prepend(form);

    cancelButton.addEventListener("click", () => form.remove());

    uploadButton.addEventListener("click", async () => {
        const file = fileInput.files[0];

        if (!file) {
            status.textContent = "Please select a file first.";
            return;
        }

        const allowedTypes = [
            "application/pdf",
            "application/msword",
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            "image/jpeg",
            "image/png"
        ];

        if (!allowedTypes.includes(file.type)) {
            status.textContent =
                "Only PDF, DOC, DOCX, JPG, and PNG files are allowed.";
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            status.textContent = "File must not exceed 10 MB.";
            return;
        }

        uploadButton.disabled = true;
        status.textContent = "Uploading file...";

        const studentId = currentUser.id;
        const safeFileName = file.name.replace(
            /[^a-zA-Z0-9._-]/g, "_"
        );

        const filePath =
            `${studentId}/${assignment.id}/${Date.now()}_${safeFileName}`;

        try {
            const { error: uploadError } = await supabaseClient
                .storage
                .from("assignment-files")
                .upload(filePath, file);

            if (uploadError) throw uploadError;

            const { error: insertError } = await supabaseClient
                .from("assignment_submissions")
                .insert({
                    assignment_id: assignment.id,
                    student_id: studentId,
                    file_name: file.name,
                    file_path: filePath
                });

            if (insertError) {
                await supabaseClient
                    .storage
                    .from("assignment-files")
                    .remove([filePath]);

                throw insertError;
            }

            status.textContent =
                "Assignment submitted successfully!";

            fileInput.disabled = true;
            uploadButton.disabled = true;

        } catch (error) {
            status.textContent =
                "Submission failed: " + error.message;
            uploadButton.disabled = false;
        }
    });
}

assignmentForm.addEventListener("submit", async event => {
    event.preventDefault();

    if (!currentProfile ||
        !["teacher", "admin"].includes(currentProfile.role)) {
        showMessage("Only teachers and admins can manage assignments.", true);
        return;
    }

    const subjectId = subjectSelect.value;
    const title = document.getElementById("title").value.trim();
    const description =
        document.getElementById("description").value.trim();
    const dueDate = document.getElementById("dueDate").value;

    if (!subjectId || !title || !dueDate) {
        showMessage("Please select a subject, enter a title and deadline.", true);
        return;
    }

    const assignmentData = {
        school_id: currentProfile.school_id,
        teacher_id: currentUser.id,
        subject_id: subjectId,
        title,
        description,
        due_date: new Date(dueDate).toISOString()
    };

    let result;

    if (editingId) {
        result = await supabaseClient
            .from("assignments")
            .update(assignmentData)
            .eq("id", editingId);
    } else {
        result = await supabaseClient
            .from("assignments")
            .insert([assignmentData]);
    }

    if (result.error) {
        showMessage(result.error.message, true);
        return;
    }

    showMessage(editingId
        ? "Assignment updated successfully!"
        : "Assignment added successfully!");

    resetForm();
    await loadAssignments();
});

function editAssignment(item) {
    editingId = item.id;

    subjectSelect.value = item.subject_id || "";
    document.getElementById("title").value = item.title;
    document.getElementById("description").value =
        item.description || "";

    document.getElementById("dueDate").value =
        item.due_date
            ? new Date(item.due_date).toISOString().slice(0, 16)
            : "";

    document.getElementById("formTitle").textContent =
        "Edit Assignment";

    document.getElementById("saveButton").textContent =
        "Update Assignment";

    document.getElementById("cancelButton").classList.remove("hidden");
    formPanel.scrollIntoView({ behavior: "smooth" });
}

async function deleteAssignment(id) {
    if (!confirm("Are you sure you want to delete this assignment?")) {
        return;
    }

    const { error } = await supabaseClient
        .from("assignments")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Error deleting assignment: " + error.message);
        return;
    }

    alert("Assignment deleted successfully!");
    await loadAssignments();
}

function resetForm() {
    editingId = null;
    assignmentForm.reset();

    document.getElementById("formTitle").textContent =
        "Create Assignment";

    document.getElementById("saveButton").textContent =
        "Add Assignment";

    document.getElementById("cancelButton").classList.add("hidden");
}

document.getElementById("cancelButton")
    .addEventListener("click", resetForm);

document.getElementById("logoutButton")
    .addEventListener("click", async event => {
        event.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = "login.html";
    });

initializePage();
</script>
</body>
</html>
