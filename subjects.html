
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect - My Subjects</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #263445;
        }

        header {
            background: #1455a0;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            font-size: 25px;
        }

        header p {
            margin-top: 6px;
            color: #dceaff;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        h2 {
            color: #1455a0;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 13px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        button {
            background: #1455a0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 18px;
            font-size: 15px;
        }

        button:hover {
            background: #0d407e;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .subject {
            border: 1px solid #e1e7ef;
            border-left: 5px solid #1455a0;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 14px;
        }

        .subject h3 {
            margin-bottom: 8px;
            color: #1455a0;
        }

        .subject p {
            margin-top: 6px;
            color: #596779;
            line-height: 1.5;
        }

        .subject-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-button {
            margin-top: 0;
            padding: 9px 16px;
        }

        .edit-button {
            background: #e9a23b;
        }

        .delete-button {
            background: #dc3545;
        }

        .generate-button {
            background: #198754;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: #198754;
        }

        .error {
            color: #dc3545;
        }

        .empty {
            color: #718096;
            padding: 12px 0;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #1455a0;
            text-decoration: none;
        }

        .role-label {
            display: inline-block;
            background: #eaf2ff;
            color: #1455a0;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .enrollment-code-box {
            margin-top: 15px;
            padding: 13px;
            background: #f0f6ff;
            border: 1px dashed #1455a0;
            border-radius: 8px;
        }

        .enrollment-code {
            display: block;
            margin-top: 7px;
            color: #1455a0;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            overflow-wrap: anywhere;
        }

        .code-note {
            font-size: 13px;
            color: #64748b;
            margin-top: 7px;
        }

        @media (max-width: 600px) {
            main {
                width: 94%;
                margin: 20px auto;
            }

            .card {
                padding: 18px;
            }

            .subject-actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>EduConnect</h1>
    <p id="pageSubtitle">Subjects</p>
</header>

<main>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

    <div>
        <span id="roleLabel" class="role-label">
            Loading account...
        </span>
    </div>

    <!-- STUDENT JOIN SUBJECT -->
    <section class="card" id="joinSubjectCard" style="display: none;">

        <h2>Join a Subject</h2>

        <p class="empty">
            Enter the enrollment code provided by your teacher.
        </p>

        <form id="joinSubjectForm">

            <label for="enrollmentCode">
                Enrollment Code
            </label>

            <input
                type="text"
                id="enrollmentCode"
                placeholder="Enter your enrollment code"
                maxlength="30"
                autocomplete="off"
                required
            >

            <button type="submit" id="joinButton">
                Join Subject
            </button>

        </form>

        <p id="joinMessage" class="message"></p>

    </section>

    <!-- ADD SUBJECT -->
    <section class="card" id="subjectFormCard">

        <h2>Add New Subject</h2>

        <form id="subjectForm">

            <label for="subjectName">Subject Name</label>

            <input
                type="text"
                id="subjectName"
                placeholder="Example: Introduction to Computing"
                required
            >

            <label for="subjectCode">Subject Code</label>

            <input
                type="text"
                id="subjectCode"
                placeholder="Example: IT101"
                required
            >

            <label for="description">Description</label>

            <textarea
                id="description"
                placeholder="Enter subject description"
            ></textarea>

            <button type="submit" id="addButton">
                Add Subject
            </button>

        </form>

        <p id="message" class="message"></p>

    </section>

    <!-- SUBJECT LIST -->
    <section class="card">

        <h2 id="subjectsHeading">Available Subjects</h2>

        <p id="subjectsDescription" class="empty"></p>

        <div id="subjectsList">
            Loading subjects...
        </div>

    </section>

</main>

<script>
    const form = document.getElementById("subjectForm");
    const formCard = document.getElementById("subjectFormCard");
    const message = document.getElementById("message");
    const subjectsList = document.getElementById("subjectsList");
    const addButton = document.getElementById("addButton");

    const roleLabel = document.getElementById("roleLabel");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const subjectsHeading = document.getElementById("subjectsHeading");
    const subjectsDescription = document.getElementById("subjectsDescription");

    const joinSubjectCard = document.getElementById("joinSubjectCard");
    const joinSubjectForm = document.getElementById("joinSubjectForm");
    const joinButton = document.getElementById("joinButton");
    const joinMessage = document.getElementById("joinMessage");
    const enrollmentCodeInput = document.getElementById("enrollmentCode");

    let currentUser = null;
    let currentProfile = null;
    let subjects = [];

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];
        });
    }

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = "message " + type;
    }

    function showJoinMessage(text, type = "") {
        joinMessage.textContent = text;
        joinMessage.className = "message " + type;
    }

    function canManageSubjects() {
        return currentProfile &&
            (
                currentProfile.role === "teacher" ||
                currentProfile.role === "admin"
            );
    }

    async function initializePage() {

        const {
            data: { user },
            error: authError
        } = await supabaseClient.auth.getUser();

        if (authError || !user) {
            window.location.href = "login.html";
            return;
        }

        currentUser = user;

        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .select("full_name, role, school_id, is_active")
            .eq("id", user.id)
            .single();

        if (profileError || !profile) {
            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
            return;
        }

        if (profile.is_active === false) {
            alert(
                "Your account has been deactivated. Please contact your school administrator."
            );

            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
            return;
        }

        currentProfile = profile;

        if (!profile.school_id) {
            document.querySelector("main").innerHTML =
                "<p>Your account is not assigned to a school yet.</p>";
            return;
        }

        if (
            profile.role !== "student" &&
            profile.role !== "teacher" &&
            profile.role !== "admin"
        ) {
            document.querySelector("main").innerHTML =
                "<p>Access denied. Authorized account required.</p>";
            return;
        }

        if (profile.role === "student") {

            pageSubtitle.textContent = "My Subjects - Student Portal";
            roleLabel.textContent = "Student Portal";

            subjectsHeading.textContent = "My Enrolled Subjects";

            subjectsDescription.textContent =
                "Subjects you are currently enrolled in.";

            formCard.style.display = "none";
            joinSubjectCard.style.display = "block";

        } else if (profile.role === "teacher") {

            pageSubtitle.textContent = "Subjects Management - Teacher Portal";
            roleLabel.textContent = "Teacher Portal";

            subjectsHeading.textContent = "My Assigned Subjects";

            subjectsDescription.textContent =
                "Subjects assigned to your teacher account.";

        } else {

            pageSubtitle.textContent = "Subjects Management - Admin Portal";
            roleLabel.textContent = "Administrator Portal";

            subjectsHeading.textContent = "All School Subjects";

            subjectsDescription.textContent =
                "Manage all subjects registered in your school.";
        }

        await loadSubjects();
    }

    async function loadSubjects() {

        subjectsList.textContent = "Loading subjects...";

        let subjectIds = [];

        // STUDENT: Get enrolled subject IDs first
        if (currentProfile.role === "student") {

            const {
                data: enrollments,
                error: enrollmentError
            } = await supabaseClient
                .from("subject_enrollments")
                .select("subject_id")
                .eq("student_id", currentUser.id)
                .eq("school_id", currentProfile.school_id);

            if (enrollmentError) {
                subjectsList.textContent =
                    "Error loading enrollments: " +
                    enrollmentError.message;
                return;
            }

            subjectIds = (enrollments || []).map(
                item => item.subject_id
            );

            if (subjectIds.length === 0) {
                subjects = [];

                subjectsList.innerHTML =
                    '<p class="empty">You are not enrolled in any subjects yet.</p>';

                return;
            }
        }

        // Load subjects according to user role
        let query = supabaseClient
            .from("subjects")
            .select(`
                id,
                subject_name,
                subject_code,
                description,
                teacher_id
            `)
            .eq("school_id", currentProfile.school_id)
            .order("subject_name");

        if (currentProfile.role === "student") {

            query = query.in("id", subjectIds);

        } else if (currentProfile.role === "teacher") {

            query = query.eq("teacher_id", currentUser.id);
        }

        const {
            data,
            error
        } = await query;

        if (error) {
            subjectsList.textContent =
                "Error loading subjects: " + error.message;
            return;
        }

        subjects = data || [];

        if (subjects.length === 0) {

            if (currentProfile.role === "student") {
                subjectsList.innerHTML =
                    '<p class="empty">You are not enrolled in any subjects yet.</p>';

            } else if (currentProfile.role === "teacher") {
                subjectsList.innerHTML =
                    '<p class="empty">No subjects are assigned to your account yet.</p>';

            } else {
                subjectsList.innerHTML =
                    '<p class="empty">No subjects have been added yet.</p>';
            }

            return;
        }

        await displaySubjects();
    }

    async function displaySubjects() {

        let subjectCards = [];

        for (const subject of subjects) {

            let actionButtons = "";
            let enrollmentCodeHTML = "";

            if (canManageSubjects()) {

                // Retrieve the existing active code
                const {
                    data: currentCode,
                    error: codeError
                } = await supabaseClient.rpc(
                    "get_subject_enrollment_code",
                    {
                        p_subject_id: subject.id
                    }
                );

                const codeText = codeError
                    ? "Unable to load code"
                    : (currentCode || "No active code generated yet.");

                enrollmentCodeHTML = `
                    <div class="enrollment-code-box">

                        <strong>Student Enrollment Code</strong>

                        <span class="enrollment-code">
                            ${escapeHTML(codeText)}
                        </span>

                        <p class="code-note">
                            Share this code with students so they can join this subject.
                        </p>

                    </div>
                `;

                actionButtons = `
                    <div class="subject-actions">

                        <button
                            class="action-button generate-button"
                            data-action="generate-code"
                            data-id="${escapeHTML(subject.id)}">
                            Generate New Code
                        </button>

                        <button
                            class="action-button edit-button"
                            data-action="edit"
                            data-id="${escapeHTML(subject.id)}">
                            Edit
                        </button>

                        <button
                            class="action-button delete-button"
                            data-action="delete"
                            data-id="${escapeHTML(subject.id)}">
                            Delete
                        </button>

                    </div>
                `;
            }

            subjectCards.push(`
                <div class="subject">

                    <h3>${escapeHTML(subject.subject_name)}</h3>

                    <p>
                        <strong>Subject Code:</strong>
                        ${escapeHTML(subject.subject_code)}
                    </p>

                    <p>
                        ${escapeHTML(
                            subject.description ||
                            "No description provided."
                        )}
                    </p>

                    ${enrollmentCodeHTML}

                    ${actionButtons}

                </div>
            `);
        }

        subjectsList.innerHTML = subjectCards.join("");
    }

    // STUDENT JOIN SUBJECT
    joinSubjectForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        if (
            !currentProfile ||
            currentProfile.role !== "student"
        ) {
            showJoinMessage(
                "Only student accounts can join subjects.",
                "error"
            );
            return;
        }

        const code = enrollmentCodeInput.value.trim();

        if (!code) {
            showJoinMessage(
                "Please enter an enrollment code.",
                "error"
            );
            return;
        }

        joinButton.disabled = true;

        showJoinMessage("Joining subject...");

        const {
            data,
            error
        } = await supabaseClient.rpc(
            "join_subject_with_code",
            {
                p_code: code
            }
        );

        joinButton.disabled = false;

        if (error) {
            showJoinMessage(
                error.message,
                "error"
            );
            return;
        }

        showJoinMessage(
            data || "Successfully enrolled in the subject!",
            "success"
        );

        joinSubjectForm.reset();

        await loadSubjects();
    });

    // ADD SUBJECT
    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        if (!canManageSubjects()) {
            showMessage("You are not authorized to add subjects.", "error");
            return;
        }

        const subjectName =
            document.getElementById("subjectName").value.trim();

        const subjectCode =
            document.getElementById("subjectCode").value.trim();

        const description =
            document.getElementById("description").value.trim();

        if (!subjectName || !subjectCode) {
            showMessage(
                "Please complete the required fields.",
                "error"
            );
            return;
        }

        addButton.disabled = true;
        showMessage("Saving subject...");

        const { error } = await supabaseClient
            .from("subjects")
            .insert([{
                subject_name: subjectName,
                subject_code: subjectCode,
                description: description || null,
                school_id: currentProfile.school_id,
                teacher_id: currentUser.id
            }]);

        addButton.disabled = false;

        if (error) {
            showMessage(
                "Error adding subject: " + error.message,
                "error"
            );
            return;
        }

        showMessage(
            "Subject added successfully!",
            "success"
        );

        form.reset();

        await loadSubjects();
    });

    // EDIT, DELETE AND GENERATE ENROLLMENT CODE
    subjectsList.addEventListener("click", async function(event) {

        const button = event.target.closest("button[data-action]");

        if (!button) return;

        if (!canManageSubjects()) {
            alert("You are not authorized to manage subjects.");
            return;
        }

        const subjectId = button.dataset.id;
        const action = button.dataset.action;

        const selectedSubject = subjects.find(
            subject => subject.id === subjectId
        );

        if (!selectedSubject) {
            alert("Subject not found. Please refresh the page.");
            return;
        }

        if (button.disabled) return;

        button.disabled = true;

        // GENERATE ENROLLMENT CODE
        if (action === "generate-code") {

            const confirmed = confirm(
                "Generate a new enrollment code for " +
                selectedSubject.subject_name +
                "?\n\nThe previous active code will stop working."
            );

            if (!confirmed) {
                button.disabled = false;
                return;
            }

            const {
                data: newCode,
                error
            } = await supabaseClient.rpc(
                "create_subject_enrollment_code",
                {
                    p_subject_id: subjectId
                }
            );

            if (error) {
                alert("Code generation failed: " + error.message);
                button.disabled = false;
                return;
            }

            alert(
                "New enrollment code generated successfully!\n\n" +
                "Subject: " + selectedSubject.subject_name +
                "\nEnrollment Code: " + newCode
            );

            await loadSubjects();
            return;
        }

        // EDIT SUBJECT
        if (action === "edit") {

            const newName = prompt(
                "Enter subject name:",
                selectedSubject.subject_name
            );

            if (newName === null) {
                button.disabled = false;
                return;
            }

            const newCode = prompt(
                "Enter subject code:",
                selectedSubject.subject_code
            );

            if (newCode === null) {
                button.disabled = false;
                return;
            }

            const newDescription = prompt(
                "Enter description:",
                selectedSubject.description || ""
            );

            if (newDescription === null) {
                button.disabled = false;
                return;
            }

            if (!newName.trim() || !newCode.trim()) {
                alert("Subject name and code are required.");
                button.disabled = false;
                return;
            }

            const { error } = await supabaseClient
                .from("subjects")
                .update({
                    subject_name: newName.trim(),
                    subject_code: newCode.trim(),
                    description: newDescription.trim() || null
                })
                .eq("id", subjectId)
                .eq("school_id", currentProfile.school_id);

            if (error) {
                alert("Update failed: " + error.message);
                button.disabled = false;
                return;
            }

            alert("Subject updated successfully!");

            await loadSubjects();
        }

        // DELETE SUBJECT
        if (action === "delete") {

            const confirmed = confirm(
                "Are you sure you want to delete this subject?"
            );

            if (!confirmed) {
                button.disabled = false;
                return;
            }

            const { error } = await supabaseClient
                .from("subjects")
                .delete()
                .eq("id", subjectId)
                .eq("school_id", currentProfile.school_id);

            if (error) {
                alert("Delete failed: " + error.message);
                button.disabled = false;
                return;
            }

            alert("Subject deleted successfully!");

            await loadSubjects();
        }
    });

    initializePage();
</script>

</body>
</html>
