
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect - Announcements</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f5fc;
            color: #302b3d;
            padding: 30px;
            animation: fadeIn 0.5s ease;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 28px;
            animation: fadeUp 0.5s ease;
        }

        h1 {
            color: #5b35a5;
            margin-bottom: 7px;
            font-size: 30px;
        }

        .header p {
            color: #777184;
            font-size: 14px;
        }

        .back-link,
        .back-link:visited,
        .back-link:active {
            display: inline-block;
            padding: 11px 17px;
            border-radius: 9px;
            background: #6842b5 !important;
            color: white !important;
            text-decoration: none !important;
            font-size: 14px;
            font-weight: bold;
            transition: 0.25s;
        }

        .back-link:hover {
            background: #4c278f !important;
            transform: translateY(-2px);
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 18px rgba(91, 53, 165, 0.07);
            border: 1px solid #eee8f8;
            animation: fadeUp 0.6s ease;
        }

        .panel h2,
        .section-heading {
            color: #6842b5;
            margin-bottom: 20px;
            font-size: 21px;
        }

        label {
            display: block;
            margin: 13px 0 7px;
            font-weight: bold;
            color: #514761;
            font-size: 13px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 13px;
            border: 1px solid #e1d9ef;
            border-radius: 9px;
            font-size: 14px;
            background: #fcfbff;
            color: #302b3d;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #7952ce;
            box-shadow: 0 0 0 3px rgba(121, 82, 206, 0.12);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        button {
            display: inline-block;
            padding: 11px 17px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #5b35a5, #7952ce);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin: 4px;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 13px rgba(91, 53, 165, 0.18);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #b91c2c;
        }

        .edit-btn {
            background: #7952ce;
        }

        #cancel-button {
            background: #8b8497;
        }

        #cancel-button:hover {
            background: #6e677a;
        }

        .announcement {
            padding: 22px;
            border: 1px solid #e8e0f5;
            border-left: 5px solid #7952ce;
            border-radius: 12px;
            margin-bottom: 17px;
            background: white;
            box-shadow: 0 3px 12px rgba(91, 53, 165, 0.05);
            transition: 0.25s;
            animation: fadeUp 0.5s ease;
        }

        .announcement:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 17px rgba(91, 53, 165, 0.09);
        }

        .announcement h3 {
            margin-bottom: 12px;
            color: #6842b5;
            font-size: 19px;
            line-height: 1.4;
        }

        .announcement p {
            color: #514761;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin-bottom: 15px;
        }

        .announcement small {
            display: block;
            color: #898297;
            font-size: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0ebf7;
        }

        #status {
            margin-bottom: 18px;
            color: #777184;
            font-size: 14px;
        }

        #announcements-list {
            color: #777184;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 25px;
            }

            .panel {
                padding: 19px;
            }

            .announcement {
                padding: 17px;
            }

            .back-link {
                margin-top: 5px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <div>
            <h1>Announcements</h1>
            <p>Stay informed with school updates.</p>
        </div>

        <a href="dashboard.html" class="back-link">
            ← Back to Dashboard
        </a>
    </div>

    <p id="status">Loading announcements...</p>

    <section class="panel" id="announcement-form-panel" hidden>
        <h2 id="form-heading">Create Announcement</h2>

        <form id="announcement-form">
            <label for="announcement-title">Announcement Title</label>
            <input
                type="text"
                id="announcement-title"
                required
                placeholder="Enter announcement title"
            >

            <label for="announcement-content">Announcement Details</label>
            <textarea
                id="announcement-content"
                required
                placeholder="Write your announcement here..."
            ></textarea>

            <button type="submit" id="save-button">
                Publish Announcement
            </button>

            <button type="button" id="cancel-button" hidden>
                Cancel Edit
            </button>
        </form>
    </section>

    <section>
        <h2 class="section-heading">Latest Announcements</h2>
        <div id="announcements-list"></div>
    </section>

</div>

<script>
let currentUser = null;
let currentProfile = null;
let editingId = null;

async function initializeAnnouncements() {
    const status = document.getElementById("status");

    const { data: { user }, error: authError } =
        await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("id, role, school_id, full_name, is_active")
            .eq("id", currentUser.id)
            .single();

    if (profileError || !profile) {
        await supabaseClient.auth.signOut();
        window.location.href = "login.html";
        return;
    }

    if (profile.is_active === false) {
        alert("Your account has been deactivated. Please contact your school administrator.");

        await supabaseClient.auth.signOut();

        window.location.href = "login.html";
        return;
    }

    if (!profile.school_id) {
        status.textContent = "Unable to load your school profile.";
        return;
    }

    currentProfile = profile;

    if (profile.role === "teacher" || profile.role === "admin") {
        document.getElementById(
            "announcement-form-panel"
        ).hidden = false;
    }

    await loadAnnouncements();

    status.textContent = "Welcome, " + profile.full_name;
}

async function loadAnnouncements() {
    const list = document.getElementById("announcements-list");

    list.textContent = "Loading...";

    const { data, error } = await supabaseClient
        .from("announcements")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        list.textContent = "Unable to load announcements.";
        console.error(error);
        return;
    }

    list.innerHTML = "";

    if (!data || data.length === 0) {
        list.textContent = "No announcements yet.";
        return;
    }

    data.forEach(item => {
        const card = document.createElement("article");
        card.className = "announcement";

        const title = document.createElement("h3");
        title.textContent = item.title;

        const content = document.createElement("p");
        content.textContent = item.content;

        const date = document.createElement("small");
        date.textContent =
            "Posted: " +
            new Date(item.created_at).toLocaleString("en-PH");

        card.append(title, content, date);

        if (
            currentProfile.role === "teacher" ||
            currentProfile.role === "admin"
        ) {
            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit-btn";

            editButton.addEventListener("click", () => {
                startEditing(item);
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.addEventListener("click", async () => {
                const confirmed = confirm(
                    "Are you sure you want to delete this announcement?"
                );

                if (!confirmed) return;

                const { error: deleteError } = await supabaseClient
                    .from("announcements")
                    .delete()
                    .eq("id", item.id);

                if (deleteError) {
                    alert(deleteError.message);
                    return;
                }

                alert("Announcement deleted successfully.");
                await loadAnnouncements();
            });

            card.append(editButton, deleteButton);
        }

        list.appendChild(card);
    });
}

function startEditing(item) {
    editingId = item.id;

    document.getElementById("announcement-title").value =
        item.title;

    document.getElementById("announcement-content").value =
        item.content;

    document.getElementById("form-heading").textContent =
        "Edit Announcement";

    document.getElementById("save-button").textContent =
        "Update Announcement";

    document.getElementById("cancel-button").hidden = false;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetAnnouncementForm() {
    editingId = null;

    document.getElementById("announcement-form").reset();

    document.getElementById("form-heading").textContent =
        "Create Announcement";

    document.getElementById("save-button").textContent =
        "Publish Announcement";

    document.getElementById("cancel-button").hidden = true;
}

document.getElementById("announcement-form")
    .addEventListener("submit", async (event) => {
        event.preventDefault();

        if (
            !currentProfile ||
            !["teacher", "admin"].includes(currentProfile.role)
        ) {
            alert("Only teachers and admins can publish announcements.");
            return;
        }

        const title = document.getElementById(
            "announcement-title"
        ).value.trim();

        const content = document.getElementById(
            "announcement-content"
        ).value.trim();

        if (!title || !content) {
            alert("Please complete all fields.");
            return;
        }

        const saveButton = document.getElementById("save-button");
        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        let result;

        if (editingId) {
            result = await supabaseClient
                .from("announcements")
                .update({
                    title: title,
                    content: content,
                    updated_at: new Date().toISOString()
                })
                .eq("id", editingId);
        } else {
            result = await supabaseClient
                .from("announcements")
                .insert({
                    school_id: currentProfile.school_id,
                    created_by: currentUser.id,
                    title: title,
                    content: content
                });
        }

        saveButton.disabled = false;

        if (result.error) {
            alert(result.error.message);
            saveButton.textContent = editingId
                ? "Update Announcement"
                : "Publish Announcement";
            return;
        }

        alert(
            editingId
                ? "Announcement updated successfully!"
                : "Announcement published successfully!"
        );

        resetAnnouncementForm();
        await loadAnnouncements();
    });

document.getElementById("cancel-button")
    .addEventListener("click", resetAnnouncementForm);

initializeAnnouncements();
</script>

</body>
</html>
