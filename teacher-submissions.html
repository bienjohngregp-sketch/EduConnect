
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Submissions | EduConnect</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #243247;
        }

        header {
            background: #1554a5;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        header a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1050px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        h1 {
            color: #1554a5;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .submission {
            border: 1px solid #dce4ef;
            border-radius: 9px;
            padding: 20px;
            margin-bottom: 15px;
            background: #ffffff;
        }

        .submission h3 {
            color: #1554a5;
            margin-bottom: 12px;
        }

        .submission p {
            margin: 10px 0;
            overflow-wrap: anywhere;
        }

        .file-section {
            background: #f4f7fb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .file-section h4 {
            margin-bottom: 8px;
            color: #243247;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd7e5;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 12px;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .preview {
            background: #16834a;
            color: white;
            margin-right: 6px;
        }

        .download {
            background: #1554a5;
            color: white;
        }

        .grade {
            background: #16834a;
            color: white;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .file-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .file-actions button {
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            header nav {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }

            header a {
                margin-left: 0;
            }

            .panel {
                padding: 18px;
            }

            .submission {
                padding: 15px;
            }

            .file-actions button {
                width: 100%;
                margin-right: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>EduConnect</h2>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="assignments.html">Assignments</a>
        <a href="#" id="logoutButton">Logout</a>
    </nav>
</header>

<main>

    <section class="panel">
        <h1>Student Submissions</h1>
        <p>
            View submitted assignments, preview and download student files,
            and provide grades and feedback.
        </p>
    </section>

    <section class="panel">
        <h2>Submitted Assignments</h2>
        <div id="submissionList">Loading submissions...</div>
    </section>

</main>

<script>
    const submissionList = document.getElementById("submissionList");

    let currentUser = null;
    let currentProfile = null;

    // =====================================
    // INITIALIZE PAGE
    // =====================================

    async function initializePage() {

        const { data: { user }, error } =
            await supabaseClient.auth.getUser();

        if (error || !user) {
            window.location.href = "login.html";
            return;
        }

        currentUser = user;

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("full_name, role, school_id, is_active")
                .eq("id", user.id)
                .single();

        if (profileError || !profile) {
            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
            return;
        }

        // Check account status
        if (profile.is_active === false) {

            alert(
                "Your account has been deactivated. Please contact your school administrator."
            );

            await supabaseClient.auth.signOut();

            window.location.href = "login.html";
            return;
        }

        // Check user role
        if (!["teacher", "admin"].includes(profile.role)) {

            submissionList.textContent =
                "Access denied. Teachers and admins only.";

            return;
        }

        currentProfile = profile;

        await loadSubmissions();
    }


    // =====================================
    // LOAD STUDENT SUBMISSIONS
    // =====================================

    async function loadSubmissions() {

        submissionList.textContent = "Loading submissions...";

        const { data, error } = await supabaseClient
            .from("assignment_submissions")
            .select("*")
            .order("submitted_at", { ascending: false });

        if (error) {

            submissionList.textContent =
                "Error loading submissions: " + error.message;

            return;
        }

        submissionList.innerHTML = "";

        if (!data || data.length === 0) {

            submissionList.textContent =
                "No student submissions yet.";

            return;
        }

        for (const item of data) {

            const { data: assignment, error: assignmentError } =
                await supabaseClient
                    .from("assignments")
                    .select("title")
                    .eq("id", item.assignment_id)
                    .single();

            const { data: student, error: studentError } =
                await supabaseClient
                    .from("profiles")
                    .select("full_name")
                    .eq("id", item.student_id)
                    .single();

            const card = document.createElement("div");
            card.className = "submission";

            // Assignment title
            const heading = document.createElement("h3");

            heading.textContent = assignmentError
                ? "Assignment unavailable"
                : assignment.title;

            // Student name
            const studentName = document.createElement("p");

            studentName.textContent =
                "Student: " +
                (studentError ? "Student unavailable" : student.full_name);

            // File name
            const fileName = document.createElement("p");

            fileName.textContent =
                "Submitted File: " + (item.file_name || "No file name");

            // Submission date
            const submittedDate = document.createElement("p");

            submittedDate.textContent =
                "Submitted: " +
                (
                    item.submitted_at
                        ? new Date(item.submitted_at).toLocaleString("en-PH")
                        : "Date unavailable"
                );

            // =====================================
            // FILE PREVIEW AND DOWNLOAD SECTION
            // =====================================

            const fileSection = document.createElement("div");
            fileSection.className = "file-section";

            const fileHeading = document.createElement("h4");
            fileHeading.textContent = "Submitted File";

            const fileActions = document.createElement("div");
            fileActions.className = "file-actions";

            // Preview button
            const previewButton = document.createElement("button");

            previewButton.className = "preview";
            previewButton.textContent = "Preview File";

            previewButton.addEventListener("click", () => {
                previewSubmission(item.file_path);
            });

            // Download button
            const downloadButton = document.createElement("button");

            downloadButton.className = "download";
            downloadButton.textContent = "Download File";

            downloadButton.addEventListener("click", () => {
                downloadSubmission(item.file_path);
            });

            fileActions.append(
                previewButton,
                downloadButton
            );

            fileSection.append(
                fileHeading,
                fileActions
            );

            // =====================================
            // GRADE INPUT
            // =====================================

            const gradeLabel = document.createElement("label");

            gradeLabel.textContent = "Grade (0–100):";

            const gradeInput = document.createElement("input");

            gradeInput.type = "number";
            gradeInput.min = "0";
            gradeInput.max = "100";
            gradeInput.step = "0.01";
            gradeInput.placeholder = "Enter grade";
            gradeInput.value = item.grade ?? "";

            // =====================================
            // FEEDBACK INPUT
            // =====================================

            const feedbackLabel = document.createElement("label");

            feedbackLabel.textContent = "Teacher Feedback:";

            const feedbackInput = document.createElement("textarea");

            feedbackInput.placeholder =
                "Write feedback for the student...";

            feedbackInput.value = item.feedback || "";

            // =====================================
            // SAVE BUTTON
            // =====================================

            const saveButton = document.createElement("button");

            saveButton.className = "grade";
            saveButton.textContent = "Save Grade and Feedback";

            const status = document.createElement("p");

            status.className = "status";

            saveButton.addEventListener("click", () => {

                saveGrade(
                    item.id,
                    gradeInput.value,
                    feedbackInput.value,
                    status,
                    saveButton
                );

            });

            // Add everything to card
            card.append(
                heading,
                studentName,
                fileName,
                submittedDate,
                fileSection,
                gradeLabel,
                gradeInput,
                feedbackLabel,
                feedbackInput,
                saveButton,
                status
            );

            submissionList.appendChild(card);
        }
    }


    // =====================================
    // PREVIEW SUBMITTED FILE
    // =====================================

    async function previewSubmission(filePath) {

        if (!filePath) {
            alert("Submitted file path is missing.");
            return;
        }

        // Open a blank tab immediately to avoid popup blocking
        const previewWindow = window.open("about:blank", "_blank");

        if (!previewWindow) {
            alert("Please allow pop-ups for EduConnect to preview files.");
            return;
        }

        previewWindow.document.write(
            "<p style='font-family:Arial;padding:20px;'>Loading file preview...</p>"
        );

        const { data, error } = await supabaseClient
            .storage
            .from("assignment-files")
            .createSignedUrl(filePath, 60);

        if (error) {

            previewWindow.close();

            alert("Preview failed: " + error.message);

            return;
        }

        previewWindow.location.href = data.signedUrl;
    }


    // =====================================
    // DOWNLOAD SUBMITTED FILE
    // =====================================

    async function downloadSubmission(filePath) {

        if (!filePath) {
            alert("Submitted file path is missing.");
            return;
        }

        const { data, error } = await supabaseClient
            .storage
            .from("assignment-files")
            .createSignedUrl(
                filePath,
                60,
                { download: true }
            );

        if (error) {

            alert("Download failed: " + error.message);

            return;
        }

        const link = document.createElement("a");

        link.href = data.signedUrl;
        link.download = "";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        document.body.appendChild(link);

        link.click();

        link.remove();
    }


    // =====================================
    // SAVE GRADE AND FEEDBACK
    // =====================================

    
    async function saveGrade(
        submissionId,
        gradeValue,
        feedbackValue,
        status,
        button
    ) {
        if (gradeValue.trim() === "") {
            status.textContent = "Please enter a grade.";
            return;
        }

        const grade = Number(gradeValue);

        if (
            !Number.isFinite(grade) ||
            grade < 0 ||
            grade > 100
        ) {
            status.textContent =
                "Grade must be between 0 and 100.";
            return;
        }

        button.disabled = true;
        status.textContent = "Saving...";

        const { data, error } = await supabaseClient
            .from("assignment_submissions")
            .update({
                grade: grade,
                feedback: feedbackValue.trim(),
                graded_by: currentUser.id
            })
            .eq("id", submissionId)
            .select("id")
            .maybeSingle();

        if (error) {
            status.textContent = "Error: " + error.message;
            button.disabled = false;
            return;
        }

        if (!data) {
            status.textContent =
                "Unable to save. No submission was updated or you don't have permission.";
            button.disabled = false;
            return;
        }

        status.textContent =
            "Grade and feedback saved successfully!";

        button.disabled = false;
    }



    // =====================================
    // LOGOUT
    // =====================================

    document.getElementById("logoutButton")
        .addEventListener("click", async function(event) {

            event.preventDefault();

            await supabaseClient.auth.signOut();

            window.location.href = "login.html";

        });


    // Start page
    initializePage();

</script>

</body>
</html>
