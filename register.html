
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | EduConnect</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f5fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #302747;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(75, 45, 130, 0.10);
            animation: fadeUp 0.6s ease;
        }

        .auth-logo {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #5b35a5;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .logo-icon {
            display: inline-flex;
            width: 42px;
            height: 42px;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #5b35a5, #7952ce);
            color: white;
            border-radius: 12px;
            margin-right: 7px;
            vertical-align: middle;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            font-size: 27px;
            color: #39246b;
            margin-bottom: 9px;
        }

        .auth-header p {
            color: #777084;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #41365b;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ded7eb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #fff;
            color: #302747;
            transition: 0.25s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #7952ce;
            box-shadow: 0 0 0 3px rgba(121, 82, 206, 0.12);
        }

        .account-info {
            background: #f3effb;
            border: 1px solid #e3daf4;
            border-radius: 10px;
            padding: 13px 15px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        .account-info strong {
            display: block;
            color: #5b35a5;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .account-info p {
            color: #716781;
            font-size: 13px;
            line-height: 1.5;
        }

        /* FORCE PURPLE CREATE ACCOUNT BUTTON */
        button#registerButton.auth-button {
            display: block;
            width: 100%;
            padding: 14px;
            border: none !important;
            border-radius: 10px;
            background: linear-gradient(135deg, #5b35a5, #7952ce) !important;
            background-color: #5b35a5 !important;
            color: #ffffff !important;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            appearance: none;
            -webkit-appearance: none;
        }

        button#registerButton.auth-button:hover {
            background: linear-gradient(135deg, #4b278f, #6842b5) !important;
            box-shadow: 0 7px 18px rgba(91, 53, 165, 0.25);
            transform: translateY(-2px);
        }

        button#registerButton.auth-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            margin-top: 15px;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            display: none;
        }

        .form-message.success {
            display: block;
            color: #176b3a;
            background: #eaf8ef;
            border: 1px solid #bce8ca;
        }

        .form-message.error {
            display: block;
            color: #b42318;
            background: #fff0ef;
            border: 1px solid #f5c5c1;
        }

        .auth-footer {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #777084;
        }

        .auth-footer a {
            color: #6842b5;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 27px 22px;
            }

            .auth-header h1 {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-container">

        <a href="index.html" class="auth-logo">
            <span class="logo-icon">E</span>
            EduConnect
        </a>

        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join EduConnect and start your learning journey.</p>
        </div>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="accountType">Account Type</label>
                <select id="accountType" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <div class="account-info" id="accountInfo">
                <strong>Student Account</strong>
                <p>Register as a student to access your classes and learning materials.</p>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="auth-button" id="registerButton">
                Create Account
            </button>

            <div id="registerMessage" class="form-message"></div>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Log In</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>

    <script>
        const accountTypeInput = document.getElementById("accountType");
        const accountInfo = document.getElementById("accountInfo");

        accountTypeInput.addEventListener("change", function () {

            if (this.value === "teacher") {

                accountInfo.innerHTML = `
                    <strong>Teacher Account Request</strong>
                    <p>Your registration will be submitted for admin approval. Your account will remain a student account until an administrator approves your request.</p>
                `;

            } else {

                accountInfo.innerHTML = `
                    <strong>Student Account</strong>
                    <p>Register as a student to access your classes and learning materials.</p>
                `;

            }

        });
    </script>

</body>
</html>
