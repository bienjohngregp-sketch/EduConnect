
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Requests | EduConnect</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f5fc;
            color: #302747;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #5b35a5, #7952ce);
            color: white;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(65, 35, 120, 0.15);
        }

        header h1 {
            font-size: 24px;
        }

        .back-link {
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 10px 16px;
            border-radius: 9px;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-link:hover {
            background: rgba(255,255,255,0.15);
        }

        main {
            width: 90%;
            max-width: 1150px;
            margin: 35px auto;
            animation: fadeUp 0.5s ease;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h2 {
            color: #4d2c8b;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #777084;
            font-size: 14px;
        }

        .stats-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid #e9e2f4;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(75, 45, 130, 0.05);
        }

        .stats-card span {
            display: block;
            color: #777084;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stats-card strong {
            color: #5b35a5;
            font-size: 30px;
        }

        .requests-panel {
            background: white;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid #e9e2f4;
            box-shadow: 0 4px 15px rgba(75, 45, 130, 0.05);
        }

        .panel-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .panel-heading h3 {
            color: #4d2c8b;
            font-size: 19px;
        }

        .refresh-btn {
            padding: 9px 14px;
            border: 1px solid #d9cbed;
            border-radius: 8px;
            color: #5b35a5;
            background: #f5f0fc;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-btn:hover {
            background: #eee6fa;
        }

        .filter-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-container input,
        .filter-container select {
            padding: 12px;
            border: 1px solid #ded7eb;
            border-radius: 9px;
            font-size: 14px;
            color: #302747;
            outline: none;
            background: white;
        }

        .filter-container input {
            flex: 1;
            min-width: 200px;
        }

        .filter-container select {
            min-width: 155px;
            color: #5b35a5;
        }

        .filter-container input:focus,
        .filter-container select:focus {
            border-color: #7952ce;
            box-shadow: 0 0 0 3px rgba(121, 82, 206, 0.10);
        }

        .request-list {
            display: grid;
            gap: 15px;
        }

        .request-card {
            border: 1px solid #e9e2f4;
            border-radius: 12px;
            padding: 19px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: 0.2s;
        }

        .request-card:hover {
            border-color: #bba5e2;
            transform: translateY(-2px);
        }

        .request-info h4 {
            color: #39246b;
            font-size: 16px;
            margin-bottom: 7px;
        }

        .request-info p {
            color: #777084;
            font-size: 13px;
            margin-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .request-date {
            color: #9990a7 !important;
            font-size: 12px !important;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 7px;
        }

        .status-pending {
            background: #fff4dc;
            color: #986300;
        }

        .status-approved {
            background: #e5f7eb;
            color: #18733c;
        }

        .status-rejected {
            background: #fff0ef;
            color: #b42318;
        }

        .request-actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .approve-btn,
        .reject-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: 0.2s;
        }

        .approve-btn {
            background: #e5f7eb;
            color: #18733c;
        }

        .approve-btn:hover {
            background: #c9efd6;
        }

        .reject-btn {
            background: #fff0ef;
            color: #b42318;
        }

        .reject-btn:hover {
            background: #ffddda;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .message {
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 17px;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #fff0ef;
            color: #b42318;
        }

        .message.success {
            display: block;
            background: #eaf8ef;
            color: #176b3a;
        }

        .empty-state {
            text-align: center;
            padding: 45px 15px;
            color: #888098;
            font-size: 14px;
        }

        .empty-state strong {
            display: block;
            color: #5b35a5;
            font-size: 17px;
            margin-bottom: 8px;
        }

        [hidden] {
            display: none !important;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 20px 5%;
            }

            header h1 {
                font-size: 20px;
            }

            main {
                width: 92%;
                margin: 25px auto;
            }

            .requests-panel {
                padding: 17px;
            }

            .request-card {
                align-items: flex-start;
            }

            .request-actions {
                width: 100%;
            }

            .request-actions button {
                flex: 1;
            }

            .filter-container {
                flex-direction: column;
            }

            .filter-container input,
            .filter-container select {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>EduConnect | Teacher Requests</h1>
    <a href="dashboard.html" class="back-link">Back to Dashboard</a>
</header>

<main>

    <div class="page-heading">
        <h2>Teacher Registration Requests</h2>
        <p>Review and manage users requesting a teacher account.</p>
    </div>

    <div class="stats-card">
        <span>Pending Teacher Requests</span>
        <strong id="pendingCount">0</strong>
    </div>

    <div class="requests-panel">

        <div class="panel-heading">
            <h3>Teacher Applications</h3>

            <button class="refresh-btn" id="refreshBtn" type="button">
                Refresh
            </button>
        </div>

        <div class="filter-container">

            <input
                type="text"
                id="searchRequests"
                placeholder="Search name or email..."
                autocomplete="off"
            >

            <select id="statusFilter">
                <option value="all">All Requests</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>

        </div>

        <div id="pageMessage" class="message"></div>

        <div id="requestList" class="request-list">
            <div class="empty-state">Loading teacher requests...</div>
        </div>

    </div>

</main>

<script>
    const pendingCount = document.getElementById("pendingCount");
    const requestList = document.getElementById("requestList");
    const pageMessage = document.getElementById("pageMessage");
    const refreshBtn = document.getElementById("refreshBtn");
    const searchRequests = document.getElementById("searchRequests");
    const statusFilter = document.getElementById("statusFilter");

    let currentRequests = [];

    function showMessage(message, type) {
        pageMessage.textContent = message;
        pageMessage.className = "message " + type;
    }

    function clearMessage() {
        pageMessage.textContent = "";
        pageMessage.className = "message";
    }

    function formatDate(dateString) {
        if (!dateString) return "Date unavailable";

        const date = new Date(dateString);

        if (Number.isNaN(date.getTime())) {
            return "Date unavailable";
        }

        return date.toLocaleString("en-PH", {
            dateStyle: "medium",
            timeStyle: "short"
        });
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(character) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[character];
        });
    }

    async function initializePage() {

        try {

            const { data: { user }, error: authError } =
                await supabaseClient.auth.getUser();

            if (authError || !user) {
                window.location.href = "login.html";
                return;
            }

            const { data: profile, error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .select("role, is_active")
                    .eq("id", user.id)
                    .single();

            if (
                profileError ||
                !profile ||
                profile.role !== "admin" ||
                profile.is_active !== true
            ) {
                alert("Access denied. Active administrators only.");
                window.location.href = "dashboard.html";
                return;
            }

            await loadRequests();

        } catch (error) {

            console.error("Initialization error:", error);

            showMessage(
                error.message || "Unable to initialize the page.",
                "error"
            );

        }
    }

    async function loadRequests() {

        clearMessage();

        refreshBtn.disabled = true;
        refreshBtn.textContent = "Loading...";

        requestList.innerHTML =
            '<div class="empty-state">Loading teacher requests...</div>';

        try {

            const { data, error } = await supabaseClient
                .from("teacher_requests")
                .select("id, user_id, full_name, email, status, created_at")
                .order("created_at", { ascending: false });

            if (error) throw error;

            currentRequests = data || [];

            pendingCount.textContent = currentRequests.filter(
                request => request.status === "pending"
            ).length;

            renderRequests();

        } catch (error) {

            console.error("Loading requests error:", error);

            requestList.innerHTML = `
                <div class="empty-state">
                    <strong>Unable to load requests</strong>
                    ${escapeHTML(error.message)}
                </div>
            `;

        } finally {

            refreshBtn.disabled = false;
            refreshBtn.textContent = "Refresh";

        }
    }

    function renderRequests() {

        const searchTerm = searchRequests.value.trim().toLowerCase();
        const selectedStatus = statusFilter.value;

        const filteredRequests = currentRequests.filter(request => {

            const fullName = String(request.full_name || "").toLowerCase();
            const email = String(request.email || "").toLowerCase();

            const matchesSearch =
                fullName.includes(searchTerm) ||
                email.includes(searchTerm);

            const matchesStatus =
                selectedStatus === "all" ||
                request.status === selectedStatus;

            return matchesSearch && matchesStatus;

        });

        if (filteredRequests.length === 0) {

            requestList.innerHTML = `
                <div class="empty-state">
                    <strong>No Requests Found</strong>
                    No teacher applications match your search or selected filter.
                </div>
            `;

            return;
        }

        requestList.innerHTML = filteredRequests.map(request => {

            const status = request.status;

            const statusLabel = String(status || "unknown").toUpperCase();

            const statusClass = {
                pending: "status-pending",
                approved: "status-approved",
                rejected: "status-rejected"
            }[status] || "";

            const actions = status === "pending" ? `
                <div class="request-actions">

                    <button
                        class="approve-btn"
                        type="button"
                        data-decision="approved"
                        data-id="${escapeHTML(request.id)}">
                        Approve
                    </button>

                    <button
                        class="reject-btn"
                        type="button"
                        data-decision="rejected"
                        data-id="${escapeHTML(request.id)}">
                        Reject
                    </button>

                </div>
            ` : "";

            return `
                <div class="request-card" data-request-id="${escapeHTML(request.id)}">

                    <div class="request-info">

                        <h4>${escapeHTML(request.full_name)}</h4>

                        <p>Email: ${escapeHTML(request.email)}</p>

                        <p class="request-date">
                            Submitted: ${escapeHTML(formatDate(request.created_at))}
                        </p>

                        <span class="status-badge ${statusClass}">
                            ${escapeHTML(statusLabel)}
                        </span>

                    </div>

                    ${actions}

                </div>
            `;

        }).join("");

    }

    async function reviewRequest(requestId, decision) {

        const request = currentRequests.find(
            item => item.id === requestId
        );

        if (!request || request.status !== "pending") {
            return;
        }

        if (!["approved", "rejected"].includes(decision)) {
            return;
        }

        const action = decision === "approved" ? "approve" : "reject";

        const confirmed = confirm(
            `Are you sure you want to ${action} the teacher request of ${request.full_name}?`
        );

        if (!confirmed) return;

        clearMessage();

        const card = requestList.querySelector(
            `[data-request-id="${requestId}"]`
        );

        const buttons = card
            ? card.querySelectorAll("button")
            : [];

        buttons.forEach(button => button.disabled = true);

        try {

            const { data, error } = await supabaseClient.rpc(
                "admin_review_teacher_request",
                {
                    p_request_id: requestId,
                    p_decision: decision
                }
            );

            if (error) throw error;

            if (!data || data.success !== true) {
                throw new Error("The request could not be processed.");
            }

            await loadRequests();

            showMessage(
                decision === "approved"
                    ? "Teacher request approved successfully. The user's role is now Teacher."
                    : "Teacher request rejected successfully. The user's role remains Student.",
                "success"
            );

        } catch (error) {

            console.error("Review request error:", error);

            showMessage(
                error.message || "Unable to process the request.",
                "error"
            );

            buttons.forEach(button => button.disabled = false);

        }

    }

    requestList.addEventListener("click", function(event) {

        const button = event.target.closest("button[data-decision]");

        if (!button) return;

        reviewRequest(
            button.dataset.id,
            button.dataset.decision
        );

    });

    searchRequests.addEventListener("input", renderRequests);

    statusFilter.addEventListener("change", renderRequests);

    refreshBtn.addEventListener("click", loadRequests);

    initializePage();
</script>

</body>
</html>
