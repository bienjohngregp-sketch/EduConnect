
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | EduConnect</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f5fc;
            color: #263445;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background: linear-gradient(135deg, #5b35a5, #7952ce);
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(91, 53, 165, 0.18);
        }

        header h2 {
            color: white;
            font-size: 23px;
        }

        header nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        header a:hover {
            color: #e3d6ff;
        }

        main {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 27px;
            border-radius: 15px;
            margin-bottom: 22px;
            border: 1px solid #eee8f8;
            box-shadow: 0 5px 20px rgba(70, 45, 120, 0.06);
            animation: fadeUp 0.5s ease both;
        }

        .panel:nth-child(2) {
            animation-delay: 0.1s;
        }

        .panel:nth-child(3) {
            animation-delay: 0.2s;
        }

        .panel:nth-child(4) {
            animation-delay: 0.3s;
        }

        h1 {
            color: #6842b5;
            margin-bottom: 10px;
            font-size: 25px;
        }

        h2 {
            color: #6842b5;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-header p {
            color: #718096;
            font-size: 14px;
        }

        .avatar {
            width: 125px;
            height: 125px;
            background: linear-gradient(135deg, #5b35a5, #7952ce);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            margin: 0 auto 17px;
            overflow: hidden;
            border: 5px solid #eee8f8;
            box-shadow: 0 5px 15px rgba(91, 53, 165, 0.15);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .avatar-controls button {
            margin-top: 0;
        }

        .profile-item {
            margin-bottom: 19px;
        }

        .profile-item label {
            display: block;
            color: #718096;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .profile-item p {
            background: #f7f5fc;
            border: 1px solid #eee8f8;
            padding: 13px;
            border-radius: 9px;
            overflow-wrap: anywhere;
            color: #354258;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dcd5e9;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: white;
        }

        input:focus {
            border-color: #7952ce;
            box-shadow: 0 0 0 3px rgba(121, 82, 206, 0.12);
        }

        button {
            padding: 12px 19px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .primary {
            background: #7952ce;
            color: white;
        }

        .primary:hover {
            background: #613bb0;
        }

        .secondary {
            background: #eee8f8;
            color: #6842b5;
        }

        .secondary:hover {
            background: #e1d6f5;
        }

        .success {
            background: #16834a;
            color: white;
        }

        .success:hover {
            background: #126b3d;
        }

        .status {
            margin-top: 13px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none;
        }

        .error-text {
            color: #dc2626;
        }

        .success-text {
            color: #16834a;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            header nav {
                gap: 14px;
            }

            main {
                margin: 22px auto;
                padding: 0 14px;
            }

            .panel {
                padding: 20px;
            }

            .avatar {
                width: 110px;
                height: 110px;
                font-size: 35px;
            }

            .form-actions button {
                flex: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>EduConnect</h2>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="assignments.html">Assignments</a>
        <a href="#" id="logoutButton">Logout</a>
    </nav>
</header>

<main>

    <!-- PROFILE PICTURE -->
    <section class="panel">

        <div class="profile-header">

            <div class="avatar" id="avatar">U</div>

            <h1 id="profileName">My Profile</h1>

            <p>Manage your EduConnect account information.</p>

        </div>

        <div class="avatar-controls">

            <input
                type="file"
                id="avatarInput"
                accept="image/png,image/jpeg,image/webp"
                hidden
            >

            <button
                type="button"
                class="primary"
                id="uploadAvatarButton"
            >
                Upload Picture
            </button>

            <button
                type="button"
                class="secondary hidden"
                id="removeAvatarButton"
            >
                Remove Picture
            </button>

        </div>

        <p class="status" id="avatarStatus"></p>

    </section>

    <!-- PERSONAL INFORMATION -->
    <section class="panel">

        <h2>Personal Information</h2>

        <div class="profile-item">
            <label>Full Name</label>
            <p id="displayName">Loading...</p>
        </div>

        <div class="profile-item">
            <label>Email Address</label>
            <p id="displayEmail">Loading...</p>
        </div>

        <div class="profile-item">
            <label>School</label>
            <p id="displaySchool">Loading...</p>
        </div>

        <div class="profile-item">
            <label>Section</label>
            <p id="displaySection">Loading...</p>
        </div>

        <div class="profile-item">
            <label>Account Role</label>
            <p id="displayRole">Loading...</p>
        </div>

        <button class="primary" id="editProfileButton" disabled>
            Edit Profile
        </button>

    </section>

    <!-- EDIT PROFILE -->
    <section class="panel hidden" id="editProfilePanel">

        <h2>Edit Profile</h2>

        <form id="profileForm">

            <div class="profile-item">
                <label for="fullNameInput">Full Name</label>

                <input
                    type="text"
                    id="fullNameInput"
                    maxlength="100"
                    required
                >
            </div>

            <div class="profile-item">
                <label for="sectionInput">Section</label>

                <input
                    type="text"
                    id="sectionInput"
                    maxlength="50"
                    placeholder="Example: BSBA MM-1B"
                >
            </div>

            <div class="form-actions">

                <button type="submit" class="success" id="saveProfileButton">
                    Save Changes
                </button>

                <button type="button" class="secondary" id="cancelEditButton">
                    Cancel
                </button>

            </div>

            <p class="status" id="profileStatus"></p>

        </form>

    </section>

    <!-- CHANGE PASSWORD -->
    <section class="panel">

        <h2>Change Password</h2>

        <form id="passwordForm">

            <div class="profile-item">
                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                    required
                >
            </div>

            <div class="profile-item">
                <label for="confirmPassword">Confirm New Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button type="submit" class="primary" id="changePasswordButton">
                Update Password
            </button>

            <p class="status" id="passwordStatus"></p>

        </form>

    </section>

</main>

<script>

    let currentUser = null;
    let currentProfile = null;

    // AVATAR DISPLAY

    function displayAvatar(profile) {

        const avatar = document.getElementById("avatar");
        const removeButton = document.getElementById("removeAvatarButton");

        avatar.innerHTML = "";

        if (profile.avatar_url) {

            const { data } = supabaseClient.storage
                .from("profile-avatars")
                .getPublicUrl(profile.avatar_url);

            const image = document.createElement("img");

            image.src = data.publicUrl;
            image.alt = "Profile Picture";

            image.onerror = function() {
                avatar.textContent = profile.full_name
                    ? profile.full_name.charAt(0).toUpperCase()
                    : "U";
            };

            avatar.appendChild(image);

            removeButton.classList.remove("hidden");

        } else {

            avatar.textContent = profile.full_name
                ? profile.full_name.charAt(0).toUpperCase()
                : "U";

            removeButton.classList.add("hidden");

        }
    }

    // LOAD PROFILE

    async function loadProfile() {

        const editButton =
            document.getElementById("editProfileButton");

        editButton.disabled = true;

        try {

            const {
                data: { user },
                error: authError
            } = await supabaseClient.auth.getUser();

            if (authError || !user) {
                window.location.href = "login.html";
                return;
            }

            currentUser = user;

            const { data: profile, error } =
                await supabaseClient
                    .from("profiles")
                    .select("full_name, role, school_id, section, is_active, avatar_url")
                    .eq("id", user.id)
                    .single();

            if (error || !profile) {
                throw new Error("Unable to load your profile.");
            }

            if (profile.is_active === false) {
                alert("Your account has been deactivated.");
                await supabaseClient.auth.signOut();
                window.location.href = "login.html";
                return;
            }

            currentProfile = profile;

            document.getElementById("profileName").textContent =
                profile.full_name || "User";

            document.getElementById("displayName").textContent =
                profile.full_name || "Not provided";

            document.getElementById("displayEmail").textContent =
                user.email || "Not available";

            document.getElementById("displaySection").textContent =
                profile.section || "Not assigned";

            document.getElementById("displayRole").textContent =
                profile.role
                    ? profile.role.charAt(0).toUpperCase() +
                      profile.role.slice(1)
                    : "Not available";

            document.getElementById("fullNameInput").value =
                profile.full_name || "";

            document.getElementById("sectionInput").value =
                profile.section || "";

            displayAvatar(profile);

            await loadSchool(profile.school_id);

            editButton.disabled = false;

        } catch (error) {

            console.error("Load profile error:", error);

            alert(error.message || "Something went wrong while loading your profile.");

        }
    }

    // LOAD SCHOOL

    async function loadSchool(schoolId) {

        const schoolDisplay =
            document.getElementById("displaySchool");

        if (!schoolId) {
            schoolDisplay.textContent = "No school assigned";
            return;
        }

        const { data, error } = await supabaseClient
            .from("schools")
            .select("name")
            .eq("id", schoolId)
            .single();

        if (error || !data) {
            schoolDisplay.textContent = "School information unavailable";
            return;
        }

        schoolDisplay.textContent = data.name;
    }

    // OPEN FILE SELECTOR

    document.getElementById("uploadAvatarButton")
        .addEventListener("click", function() {

            document.getElementById("avatarInput").click();

        });

    // UPLOAD PROFILE PICTURE

    document.getElementById("avatarInput")
        .addEventListener("change", async function() {

            const file = this.files[0];

            if (!file) return;

            const status = document.getElementById("avatarStatus");
            const uploadButton = document.getElementById("uploadAvatarButton");
            const removeButton = document.getElementById("removeAvatarButton");

            status.className = "status";

            const allowedTypes = [
                "image/jpeg",
                "image/png",
                "image/webp"
            ];

            if (!allowedTypes.includes(file.type)) {

                status.textContent =
                    "Please select a JPG, PNG, or WEBP image.";

                status.classList.add("error-text");
                this.value = "";
                return;

            }

            if (file.size > 2 * 1024 * 1024) {

                status.textContent =
                    "Image must not exceed 2 MB.";

                status.classList.add("error-text");
                this.value = "";
                return;

            }

            if (!currentUser) {
                status.textContent = "Please log in again.";
                status.classList.add("error-text");
                return;
            }

            uploadButton.disabled = true;
            removeButton.disabled = true;

            status.textContent = "Uploading profile picture...";

            let uploadedPath = null;

            try {

                const extension = file.type === "image/jpeg"
                    ? "jpg"
                    : file.type === "image/png"
                        ? "png"
                        : "webp";

                const filePath =
                    currentUser.id + "/" +
                    Date.now() + "-" +
                    Math.random().toString(36).slice(2) +
                    "." + extension;

                const { error: uploadError } =
                    await supabaseClient.storage
                        .from("profile-avatars")
                        .upload(filePath, file, {
                            contentType: file.type,
                            cacheControl: "3600",
                            upsert: false
                        });

                if (uploadError) {
                    throw uploadError;
                }

                uploadedPath = filePath;

                const { error: updateError } =
                    await supabaseClient
                        .from("profiles")
                        .update({
                            avatar_url: filePath
                        })
                        .eq("id", currentUser.id);

                if (updateError) {
                    throw updateError;
                }

                const oldPath = currentProfile.avatar_url;

                currentProfile.avatar_url = filePath;

                displayAvatar(currentProfile);

                if (oldPath) {

                    const { error: deleteError } =
                        await supabaseClient.storage
                            .from("profile-avatars")
                            .remove([oldPath]);

                    if (deleteError) {
                        console.error(
                            "Old image cleanup error:",
                            deleteError
                        );
                    }

                }

                status.textContent =
                    "Profile picture uploaded successfully!";

                status.classList.add("success-text");

            } catch (error) {

                console.error("Avatar upload error:", error);

                if (uploadedPath) {

                    await supabaseClient.storage
                        .from("profile-avatars")
                        .remove([uploadedPath]);

                }

                status.textContent =
                    "Upload failed: " + error.message;

                status.classList.add("error-text");

            } finally {

                uploadButton.disabled = false;
                removeButton.disabled = false;
                this.value = "";

            }

        });

    // REMOVE PROFILE PICTURE

    document.getElementById("removeAvatarButton")
        .addEventListener("click", async function() {

            if (!currentProfile || !currentProfile.avatar_url) {
                return;
            }

            const confirmRemove = confirm(
                "Are you sure you want to remove your profile picture?"
            );

            if (!confirmRemove) return;

            const status = document.getElementById("avatarStatus");
            const uploadButton = document.getElementById("uploadAvatarButton");

            this.disabled = true;
            uploadButton.disabled = true;

            status.className = "status";
            status.textContent = "Removing profile picture...";

            try {

                const oldPath = currentProfile.avatar_url;

                const { error: updateError } =
                    await supabaseClient
                        .from("profiles")
                        .update({
                            avatar_url: null
                        })
                        .eq("id", currentUser.id);

                if (updateError) {
                    throw updateError;
                }

                currentProfile.avatar_url = null;

                displayAvatar(currentProfile);

                const { error: deleteError } =
                    await supabaseClient.storage
                        .from("profile-avatars")
                        .remove([oldPath]);

                if (deleteError) {
                    console.error("Image deletion error:", deleteError);
                }

                status.textContent =
                    "Profile picture removed successfully!";

                status.classList.add("success-text");

            } catch (error) {

                console.error("Remove avatar error:", error);

                status.textContent =
                    "Unable to remove picture: " + error.message;

                status.classList.add("error-text");

            } finally {

                this.disabled = false;
                uploadButton.disabled = false;

            }

        });

    // SHOW EDIT PROFILE

    document.getElementById("editProfileButton")
        .addEventListener("click", function() {

            if (!currentProfile) return;

            document.getElementById("editProfilePanel")
                .classList.remove("hidden");

            document.getElementById("profileStatus").textContent = "";

            document.getElementById("fullNameInput").value =
                currentProfile.full_name || "";

            document.getElementById("sectionInput").value =
                currentProfile.section || "";

        });

    // CANCEL EDIT

    document.getElementById("cancelEditButton")
        .addEventListener("click", function() {

            document.getElementById("editProfilePanel")
                .classList.add("hidden");

            document.getElementById("profileStatus").textContent = "";

        });

    // SAVE PROFILE

    document.getElementById("profileForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const fullName =
                document.getElementById("fullNameInput").value.trim();

            const section =
                document.getElementById("sectionInput").value.trim();

            const status =
                document.getElementById("profileStatus");

            const button =
                document.getElementById("saveProfileButton");

            status.className = "status";

            if (!fullName) {
                status.textContent = "Please enter your full name.";
                status.classList.add("error-text");
                return;
            }

            if (fullName.length < 2) {
                status.textContent = "Full name must contain at least 2 characters.";
                status.classList.add("error-text");
                return;
            }

            button.disabled = true;
            status.textContent = "Saving changes...";

            try {

                const { error } = await supabaseClient
                    .from("profiles")
                    .update({
                        full_name: fullName,
                        section: section || null
                    })
                    .eq("id", currentUser.id);

                if (error) {
                    throw error;
                }

                await loadProfile();

                status.textContent = "Profile updated successfully!";
                status.className = "status success-text";

                document.getElementById("editProfilePanel")
                    .classList.add("hidden");

            } catch (error) {

                status.textContent =
                    "Update failed: " + error.message;

                status.className = "status error-text";

            } finally {

                button.disabled = false;

            }

        });

    // CHANGE PASSWORD

    document.getElementById("passwordForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const password =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const status =
                document.getElementById("passwordStatus");

            const button =
                document.getElementById("changePasswordButton");

            status.className = "status";

            if (password.length < 8) {
                status.textContent =
                    "Password must contain at least 8 characters.";

                status.classList.add("error-text");
                return;
            }

            if (password !== confirmPassword) {
                status.textContent = "Passwords do not match.";
                status.classList.add("error-text");
                return;
            }

            button.disabled = true;
            status.textContent = "Updating password...";

            try {

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) {
                    throw error;
                }

                status.textContent =
                    "Password updated successfully!";

                status.classList.add("success-text");

                document.getElementById("passwordForm").reset();

            } catch (error) {

                status.textContent =
                    "Password update failed: " + error.message;

                status.classList.add("error-text");

            } finally {

                button.disabled = false;

            }

        });

    // LOGOUT

    document.getElementById("logoutButton")
        .addEventListener("click", async function(event) {

            event.preventDefault();

            await supabaseClient.auth.signOut();

            window.location.href = "login.html";

        });

    // START PAGE

    loadProfile();

</script>

</body>
</html>
